# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Memory tuning and garbage collection optimization
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel project execution
org.gradle.parallel=true

# Enable build cache (reuses outputs across builds)
org.gradle.caching=true

# Enable Configuration Cache (skips configuration phase when inputs haven't changed)
org.gradle.configuration-cache=true

# Kotlin Compiler Daemon memory tuning
kotlin.daemon.jvmargs=-Xmx2048m

# Enable non-transitive R classes for faster incremental compilation
android.nonTransitiveRClass=true

# Enable KSP incremental processing and memory configuration
ksp.incremental=true
ksp.jvmargs=-Xmx2048m

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.disallowKotlinSourceSets=false